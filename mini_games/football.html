<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Retro Bowl Run</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #222;
            font-family: 'Arial Black', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        canvas {
            display: block;
            background-color: #2e8b57;
            /* 芝生の色 */
            border: 4px solid #fff;
        }

        #ui-layer {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 100%;
            pointer-events: none;
        }

        .hud-text {
            font-size: 20px;
            text-shadow: 2px 2px 0 #000;
            margin-bottom: 5px;
        }

        #message-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            text-shadow: 3px 3px 0 #000;
            display: none;
            /* JSで制御 */
        }

        h1 {
            margin: 0;
            font-size: 40px;
            color: #ffcc00;
        }

        p {
            font-size: 18px;
        }

        .blink {
            animation: blinker 1s linear infinite;
        }

        @keyframes blinker {
            50% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <div id="ui-layer">
            <div class="hud-text" id="scoreDisplay">SCORE: 0</div>
            <div class="hud-text" id="yardsDisplay">YARDS: 0</div>
            <div class="hud-text" id="downDisplay">DOWN: 1st & 10</div>
        </div>

        <div id="message-overlay">
            <h1 id="msg-title">TOUCHDOWN!</h1>
            <p id="msg-sub" class="blink">Click to Kickoff</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const msgOverlay = document.getElementById('message-overlay');
        const msgTitle = document.getElementById('msg-title');
        const msgSub = document.getElementById('msg-sub');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const yardsDisplay = document.getElementById('yardsDisplay');

        // ゲームの状態
        let gameState = 'START'; // START, PLAYING, GAMEOVER, TOUCHDOWN
        let frameCount = 0;
        let score = 0;
        let yardsGained = 0;
        let speed = 4;

        // プレイヤー設定
        const player = {
            x: 200,
            y: 500,
            width: 30,
            height: 30,
            color: '#0055ff', // 青
            speed: 5
        };

        // 入力管理
        const keys = {
            ArrowLeft: false,
            ArrowRight: false
        };

        // 敵とフィールドオブジェクト
        let enemies = [];
        let yardLines = [];
        let endZoneY = -1000; // エンドゾーンの位置（遠くから始まる）
        let distanceToTouchdown = 1000; // タッチダウンまでの距離ピクセル

        // イベントリスナー
        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.code)) keys[e.code] = true;
            if (e.code === 'Space' || e.code === 'Enter') handleInput();
        });
        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.code)) keys[e.code] = false;
        });
        canvas.addEventListener('mousedown', handleInput);

        // タッチ操作対応（スマホ用）
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touchX = e.touches[0].clientX - canvas.getBoundingClientRect().left;
            if (touchX < canvas.width / 2) keys.ArrowLeft = true;
            else keys.ArrowRight = true;
            handleInput();
        });
        canvas.addEventListener('touchend', (e) => {
            keys.ArrowLeft = false;
            keys.ArrowRight = false;
        });

        function handleInput() {
            if (gameState === 'START' || gameState === 'GAMEOVER' || gameState === 'TOUCHDOWN') {
                startGame();
            }
        }

        function startGame() {
            if (gameState === 'GAMEOVER') {
                score = 0;
                speed = 4;
            }
            // TOUCHDOWNの場合はスコアとスピードを引き継ぐ

            gameState = 'PLAYING';
            player.x = 200;
            player.y = 500;
            yardsGained = 0;
            enemies = [];
            yardLines = [];

            // 最初のヤードライン生成
            for (let i = 0; i < canvas.height / 50; i++) {
                yardLines.push({ y: i * 50, label: (i * 5) % 50 === 0 ? (50 - (i * 5) % 100) : null });
            }

            distanceToTouchdown = 2000; // 次のタッチダウンまでの距離
            endZoneY = -2000; // 画面外へ

            msgOverlay.style.display = 'none';
            updateHUD();
            loop();
        }

        // 描画関数：プレイヤー（ヘルメットとボール風）
        function drawPlayer(x, y) {
            ctx.save();
            // 体
            ctx.fillStyle = player.color;
            ctx.fillRect(x - 15, y - 15, 30, 30);
            // ショルダーパッド
            ctx.fillStyle = '#fff';
            ctx.fillRect(x - 20, y - 18, 40, 8);
            // ヘルメット
            ctx.fillStyle = '#ddd';
            ctx.beginPath();
            ctx.arc(x, y - 5, 10, 0, Math.PI * 2);
            ctx.fill();
            // ボール
            ctx.fillStyle = '#8B4513'; // 茶色
            ctx.beginPath();
            ctx.ellipse(x + 10, y + 5, 6, 10, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // 描画関数：敵
        function drawEnemy(e) {
            ctx.save();
            // 体
            ctx.fillStyle = '#cc0000'; // 赤
            ctx.fillRect(e.x - 15, e.y - 15, 30, 30);
            // ショルダーパッド
            ctx.fillStyle = '#fff';
            ctx.fillRect(e.x - 20, e.y - 18, 40, 8);
            // ヘルメット
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(e.x, e.y - 5, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            // プレイヤー移動
            if (keys.ArrowLeft && player.x > 20) player.x -= player.speed;
            if (keys.ArrowRight && player.x < canvas.width - 20) player.x += player.speed;

            // フィールド進行（スクロール）
            distanceToTouchdown -= speed;
            yardsGained += speed / 100; // 擬似的なヤード計算

            // ヤードラインの管理
            yardLines.forEach(line => {
                line.y += speed;
            });
            // 画面外に出たラインを削除し、上に追加
            if (yardLines[0].y > canvas.height) {
                yardLines.shift();
                const lastY = yardLines[yardLines.length - 1].y;
                // ラベルロジック（適当に数字を出す）
                yardLines.push({ y: lastY - 50, label: null });
            }

            // エンドゾーン管理
            if (distanceToTouchdown <= canvas.height && endZoneY < -1000) {
                endZoneY = -100; // エンドゾーンが見え始める
            }
            if (distanceToTouchdown <= 0) {
                // エンドゾーン到着アニメーション
                endZoneY += speed;
            }

            // 敵の生成
            if (frameCount % (60 - Math.floor(speed * 2)) === 0 && distanceToTouchdown > 600) {
                const enemyX = Math.random() * (canvas.width - 60) + 30;
                enemies.push({ x: enemyX, y: -50 });
            }

            // 敵の移動と衝突判定
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.y += speed * 1.2; // プレイヤーより少し速く流れる（相対速度）

                // 敵がプレイヤーに向かって少し動く（追尾）
                if (e.y < player.y - 50) {
                    if (e.x < player.x) e.x += 0.5;
                    else e.x -= 0.5;
                }

                // 衝突判定
                const dx = player.x - e.x;
                const dy = player.y - e.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 30) {
                    gameState = 'GAMEOVER';
                    showGameOver();
                }

                if (e.y > canvas.height + 50) {
                    enemies.splice(i, 1);
                    score += 10; // 回避ボーナス
                }
            }

            // タッチダウン判定
            if (endZoneY > player.y) {
                gameState = 'TOUCHDOWN';
                score += 500;
                speed += 1; // レベルアップ
                showTouchdown();
            }

            updateHUD();
            frameCount++;
        }

        function draw() {
            // フィールド（芝生）
            ctx.fillStyle = '#2e8b57';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // エンドゾーン描画
            if (distanceToTouchdown < canvas.height) {
                ctx.fillStyle = '#aa0000'; // エンドゾーン色
                // プレイヤーとの距離に基づいて描画位置計算（簡易的）
                let drawY = player.y - distanceToTouchdown;
                if (gameState === 'TOUCHDOWN') drawY = endZoneY; // 確定後は固定

                ctx.fillRect(0, drawY, canvas.width, canvas.height);

                ctx.fillStyle = '#ffcc00';
                ctx.font = '40px Arial Black';
                ctx.textAlign = 'center';
                ctx.fillText("TOUCHDOWN", canvas.width / 2, drawY + 150);
            }

            // ヤードライン描画
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.lineWidth = 2;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.font = '14px Arial';
            ctx.textAlign = 'center';

            yardLines.forEach(line => {
                ctx.beginPath();
                ctx.moveTo(0, line.y);
                ctx.lineTo(canvas.width, line.y);
                ctx.stroke();

                // ハッシュマーク
                ctx.beginPath();
                ctx.moveTo(canvas.width / 3, line.y);
                ctx.lineTo(canvas.width / 3 + 20, line.y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(canvas.width * 2 / 3, line.y);
                ctx.lineTo(canvas.width * 2 / 3 - 20, line.y);
                ctx.stroke();
            });

            // プレイヤーと敵
            enemies.forEach(e => drawEnemy(e));
            drawPlayer(player.x, player.y);
        }

        function updateHUD() {
            scoreDisplay.innerText = `SCORE: ${score}`;
            yardsDisplay.innerText = `YARDS: ${Math.floor(yardsGained)}`;
        }

        function showGameOver() {
            msgTitle.innerText = "TACKLED!";
            msgTitle.style.color = "red";
            msgSub.innerText = "Click to Retry";
            msgOverlay.style.display = 'block';
        }

        function showTouchdown() {
            msgTitle.innerText = "TOUCHDOWN!!";
            msgTitle.style.color = "#ffcc00";
            msgSub.innerText = "Click for Next Drive";
            msgOverlay.style.display = 'block';
        }

        function loop() {
            if (gameState === 'START') {
                draw();
                msgTitle.innerText = "RETRO BOWL RUN";
                msgTitle.style.color = "#fff";
                msgSub.innerText = "Click or Press Space to Start";
                msgOverlay.style.display = 'block';
                return;
            }

            update();
            draw();

            if (gameState === 'PLAYING') {
                requestAnimationFrame(loop);
            }
        }

        // 初回描画
        loop();

    </script>
</body>

</html>
